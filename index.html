
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b5e20">
  <title>Điểm danh QR Code</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap"
    rel="stylesheet"
  >
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --green-main: #1b5e20;
      --white-glass: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2svh;
      font-family: Arial, sans-serif;
      background:
        url("https://i.postimg.cc/Y25PyfMX/Nen-37.jpg")
        center / cover no-repeat fixed;
      padding: clamp(12px, 4vw, 32px);
      text-align: center;
    }

    .logo-container img {
      height: clamp(70px, 18svh, 220px);
      max-width: 80vw;
      object-fit: contain;
    }

    .slogan {
      font-family: "Dancing Script", cursive;
      font-size: clamp(20px, 4vw, 36px);
      color: var(--green-main);
      letter-spacing: 0.1em;
      margin: 0.5svh 0 2svh;
      font-weight: 600;
    }

    #qr-wrapper {
      width: min(85vw, 420px);
      background: var(--white-glass);
      padding: clamp(12px, 3vw, 24px);
      border-radius: clamp(12px, 3vw, 22px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    #reader {
      width: 100%;
      min-width: 0;
      border-radius: clamp(10px, 3vw, 18px);
      overflow: hidden;
      background: #fff;
      padding: 4px;
    }

    /* Giữ giao diện vuông cho ảnh đại biểu */
    #person-img {
      display: none;
      width: 100%;
      aspect-ratio: 1;
      border-radius: clamp(10px, 3vw, 18px);
      background: #fff;
      padding: 4px;
      object-fit: contain;
    }

    #result {
      margin-top: 2svh;
      font-size: clamp(0.85rem, 2.5vw, 1.1rem);
      background: rgba(209, 231, 221, 0.95);
      color: #0f5132;
      padding: clamp(8px, 2vw, 14px);
      border-radius: clamp(8px, 2vw, 14px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      width: min(90vw, 420px);
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #person-info {
      display: none;
      width: min(90vw, 420px);
      margin-top: 1svh;
      padding: 12px;
      border-radius: 10px;
      background: var(--white-glass);
    }

    #person-name {
      font-weight: bold;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      color: #1e3a8a;
      overflow-wrap: anywhere;
    }

    #person-time {
      margin-top: 8px;
      font-size: clamp(0.8rem, 2.3vw, 1rem);
      color: #333;
    }

    #reader button {
      cursor: pointer;
    }

    #reader select {
      max-width: 100%;
    }

    @media (min-width: 1200px) {
      body {
        gap: 3svh;
      }

      #qr-wrapper {
        width: 460px;
      }
    }

    @media (max-width: 480px) {
      .slogan {
        letter-spacing: 0.04em;
      }
    }
  </style>
</head>

<body>
  <div class="logo-container">
    <img
      src="https://i.postimg.cc/nLSRKq3j/BTDHCC-01.png"
      alt="Logo Đoàn trường"
    >
  </div>

  <div class="slogan">
    <em>Xung kích - tình nguyện - vì cộng đồng</em>
  </div>

  <div id="qr-wrapper">
    <div id="reader"></div>
    <img id="person-img" src="" alt="Ảnh cá nhân">
  </div>

  <div id="result" role="status" aria-live="polite">
    Sẵn sàng quét mã QR.
  </div>

  <div id="person-info">
    <div id="person-name"></div>
    <div id="person-time"></div>
  </div>

  <script>
    // Web App URL của bạn — giữ nguyên đường dẫn đang sử dụng
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzQ4lrhZ8o4G5UzlQ4vt9iXr5JmW55AqMr1gs6L7BgplG0o2V4fXlMZaDt_bwkFmAoW/exec";

    const resultBox = document.getElementById("result");
    const infoBox = document.getElementById("person-info");
    const imageBox = document.getElementById("person-img");
    const nameBox = document.getElementById("person-name");
    const timeBox = document.getElementById("person-time");

    let scanner = null;
    let processing = false;
    let restartTimer = null;

    function startScanner() {
      if (typeof Html5QrcodeScanner === "undefined") {
        resultBox.textContent =
          "Không tải được thư viện quét QR. Vui lòng kiểm tra Internet.";
        return;
      }

      document.getElementById("reader").innerHTML = "";

      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: function (viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(
              Math.min(viewfinderWidth, viewfinderHeight) * 0.7
            );
            return {
              width: Math.min(size, 250),
              height: Math.min(size, 250)
            };
          },
          rememberLastUsedCamera: true
        },
        false
      );

      scanner.render(onScanSuccess, function () {});
    }

    function onScanSuccess(decodedText) {
      if (processing) return;

      processing = true;
      resultBox.textContent = "Đang ghi nhận điểm danh...";
      infoBox.style.display = "none";
      imageBox.style.display = "none";

      const currentScanner = scanner;

      currentScanner.clear()
        .catch(function (error) {
          console.warn("Không thể dừng máy quét:", error);
        })
        .finally(function () {
          requestAttendance(decodedText);
        });
    }

    function requestAttendance(qrText) {
      if (
        !API_URL.startsWith("https://script.google.com/macros/s/") ||
        !API_URL.endsWith("/exec")
      ) {
        showResult({
          success: false,
          message: "Web App URL không hợp lệ."
        });
        return;
      }

      const script = document.createElement("script");

      script.src =
        API_URL +
        "?action=attendance&studentId=" +
        encodeURIComponent(qrText) +
        "&_=" + Date.now();

      script.onload = function () {
        script.remove();
      };

      script.onerror = function () {
        script.remove();

        showResult({
          success: false,
          message:
            "Không kết nối được Apps Script. Hãy kiểm tra URL, bản triển khai và quyền truy cập."
        });
      };

      document.body.appendChild(script);
    }

    // Nhận dữ liệu JSONP trả về từ Apps Script
    window.handleAttendanceResponse = function (response) {
      showResult(response);
    };

    function showResult(response) {
      resultBox.textContent =
        response.message || "Không nhận được kết quả.";

      if (response.success) {
        nameBox.textContent = response.name || "";
        timeBox.textContent = response.time
          ? "⏰ " + response.time
          : "";

        if (response.image) {
          imageBox.onload = function () {
            imageBox.style.display = "block";
          };

          imageBox.onerror = function () {
            imageBox.style.display = "none";
          };

          imageBox.src = response.image;
        } else {
          imageBox.removeAttribute("src");
          imageBox.style.display = "none";
        }

        infoBox.style.display = "block";
      } else {
        infoBox.style.display = "none";
        imageBox.style.display = "none";
      }

      clearTimeout(restartTimer);

      restartTimer = setTimeout(function () {
        processing = false;
        startScanner();
      }, 4000);
    }

    startScanner();
  </script>
</body>
</html>
